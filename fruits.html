<!DOCTYPE html>
<html lang="en">
<head>
    
    <title>Document</title>
</head>
<body>
    <p id="demo"></p>
    <script> var fruits=["Apple","Mango","grapes","watermelon","Aditya","banana"]
    var text=""
    var i
    for(i=0;i<fruits.length;i++){
        text +=fruits[i]+"<br>"
    }
    document.getElementById("demo").innerHTML=text</script>
   
    
</body>
</html>
